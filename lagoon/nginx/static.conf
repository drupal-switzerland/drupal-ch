### Static-only server: serves the wget mirror in /app/static, never talks to PHP.
### Revert by removing the COPY of this file in lagoon/nginx.dockerfile.
server {
  listen ${NGINX_LISTEN:-8080} default_server;

  include /etc/nginx/helpers/010_redirects.conf;

  root /app/static;
  index index.html;

  # ponytail: static healthz, the stock one can route to php-fpm.
  location = /.lagoonhealthz {
    default_type application/json;
    return 200 '{"check_nginx":"pass"}';
  }

  location ^~ /sites/default/files/private/ {
    return 404;
  }

  location / {
    try_files $uri $uri.html $uri/index.html @web;
  }

  # Fall back to real webroot for assets only (uploaded images, theme files).
  location @web {
    root /app/web;
    if ($uri !~* \.(css|js|map|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|eot|otf|pdf|mp4|webm|webmanifest)$) {
      return 404;
    }
    expires 30d;
    try_files $uri =404;
  }
}
